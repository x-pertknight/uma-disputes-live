<text x="797.5999999999999" y="537" font-size="27" fill="#2a6fb0" text-anchor="start" font-weight="bold">it</text>
<text x="60" y="650" font-size="44" fill="#1c1c1c" text-anchor="start" font-weight="bold">The first challenge doesn’t decide</text>
<text x="60" y="760" font-size="96" fill="#4a535c" text-anchor="start" font-weight="bold">9 in 10</text>
<text x="60" y="808" font-size="27" fill="#1c1c1c" text-anchor="start" font-weight="normal">challenges are first ones,</text>
<text x="60" y="842" font-size="27" fill="#1c1c1c" text-anchor="start" font-weight="normal">sent back to be asked again</text>
