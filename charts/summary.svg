<text x="60" y="960" font-size="44" fill="#1c1c1c" text-anchor="start" font-weight="bold">The rise after June</text>
<text x="60" y="1070" font-size="76" fill="#d9822b" text-anchor="start" font-weight="bold">36% → 61%</text>
